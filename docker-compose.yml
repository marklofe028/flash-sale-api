version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flash-sale-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SALE_STOCK=100
      # Set these to control the sale window:
      # SALE_START=2025-01-01T10:00:00.000Z
      # SALE_END=2025-01-01T11:00:00.000Z
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full

volumes:
  redis_data:
